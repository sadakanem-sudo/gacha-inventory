<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172b4d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ガチャ在庫">
<link rel="manifest" href="manifest.webmanifest">
<title>ガチャ在庫管理</title>
<style>
:root{--navy:#172b4d;--bg:#f3f6fa;--line:#e3e8ef;--muted:#6b7788;--green:#147d55;--red:#bd3b42}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#172334;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{background:var(--navy);color:white;padding:22px 18px 20px;border-radius:0 0 22px 22px}
h1{font-size:21px;margin:0 0 16px;font-weight:750}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#ffffff18;border:1px solid #ffffff22;border-radius:14px;padding:12px}.stat small{display:block;color:#d4deeb;font-size:12px}.stat strong{font-size:25px;display:block;margin-top:3px}
main{padding:16px;max-width:650px;margin:auto}.toolbar{display:flex;gap:9px;margin-bottom:14px}.search{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:15px;background:white}.add{border:0;background:var(--navy);color:white;border-radius:12px;padding:0 16px;font-weight:700;font-size:14px}
.item{background:white;border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:10px;box-shadow:0 2px 8px #172b4d08}.itemtop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.name{font-weight:700;font-size:16px;overflow-wrap:anywhere}.del{border:0;background:#f5f6f8;color:#77808d;border-radius:9px;padding:7px 10px;font-size:12px}
.counters{display:grid;grid-template-columns:1fr 1fr;gap:10px}.counter{background:#f5f7fa;border-radius:12px;padding:10px}.counter label{font-size:12px;color:var(--muted);display:block;margin-bottom:8px}.controls{display:flex;align-items:center;justify-content:space-between;gap:8px}.num{font-size:23px;font-weight:750;min-width:26px;text-align:center;font-variant-numeric:tabular-nums}.step{width:38px;height:38px;border:0;border-radius:11px;background:white;color:var(--navy);font-size:23px;font-weight:600;box-shadow:0 1px 4px #172b4d18}.step:active,.add:active{transform:scale(.97)}.empty{text-align:center;color:var(--muted);padding:35px 10px;background:white;border-radius:14px}
.note{text-align:center;color:var(--muted);font-size:11px;margin:18px 0 8px}
dialog{border:0;border-radius:18px;padding:20px;width:calc(100% - 36px);max-width:420px;box-shadow:0 15px 60px #0003}dialog::backdrop{background:#0c183080}dialog h2{margin:0 0 15px;font-size:18px}dialog input{width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;font-size:16px;margin-bottom:14px} .actions{display:flex;gap:9px}.actions button{flex:1;padding:12px;border:0;border-radius:11px;font-weight:700}.cancel{background:#eef1f5;color:#344054}.save{background:var(--navy);color:white}
</style>
</head>
<body>
<header>
  <h1>ガチャ在庫管理</h1>
  <div class="stats">
    <div class="stat"><small>商品種類</small><strong id="kinds">0</strong></div>
    <div class="stat"><small>総在庫数</small><strong id="total">0</strong></div>
  </div>
</header>
<main>
  <div class="toolbar">
    <input id="search" class="search" type="search" placeholder="商品名で検索">
    <button class="add" id="add">＋ 商品追加</button>
  </div>
  <section id="list"></section>
  <p class="note">このiPhone内に自動保存されます</p>
</main>
<dialog id="dlg">
  <form method="dialog" id="addform">
    <h2>商品を追加</h2>
    <input id="newname" maxlength="60" placeholder="商品名を入力" required>
    <div class="actions">
      <button class="cancel" value="cancel">キャンセル</button>
      <button class="save" id="save" value="default">追加する</button>
    </div>
  </form>
</dialog>
<script>
const KEY='gacha-inventory-v1';
let items=[];
try{items=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){items=[]}
const $=id=>document.getElementById(id);
function persist(){localStorage.setItem(KEY,JSON.stringify(items));render()}
function change(id,key,delta){const x=items.find(v=>v.id===id);if(!x)return;x[key]=Math.max(0,(Number(x[key])||0)+delta);persist()}
function render(){
 const q=$('search').value.trim().toLowerCase();
 $('kinds').textContent=items.length;
 $('total').textContent=items.reduce((s,x)=>s+(Number(x.stock)||0),0);
 const visible=items.filter(x=>x.name.toLowerCase().includes(q));
 $('list').innerHTML='';
 if(!visible.length){$('list').innerHTML=`<div class="empty">${items.length?'該当する商品がありません':'「＋ 商品追加」から商品を登録してください'}</div>`;return}
 visible.forEach(x=>{
  const card=document.createElement('article');card.className='item';
  const top=document.createElement('div');top.className='itemtop';
  const name=document.createElement('div');name.className='name';name.textContent=x.name;
  const del=document.createElement('button');del.className='del';del.textContent='削除';del.onclick=()=>{if(confirm('「'+x.name+'」を削除しますか？')){items=items.filter(v=>v.id!==x.id);persist()}};
  top.append(name,del);
  const counters=document.createElement('div');counters.className='counters';
  [['stock','在庫数'],['listed','出品数']].forEach(([key,label])=>{
   const box=document.createElement('div');box.className='counter';
   const lab=document.createElement('label');lab.textContent=label;
   const controls=document.createElement('div');controls.className='controls';
   const minus=document.createElement('button');minus.className='step';minus.textContent='−';minus.setAttribute('aria-label',label+'を1減らす');minus.onclick=()=>change(x.id,key,-1);
   const num=document.createElement('span');num.className='num';num.textContent=x[key]||0;
   const plus=document.createElement('button');plus.className='step';plus.textContent='＋';plus.setAttribute('aria-label',label+'を1増やす');plus.onclick=()=>change(x.id,key,1);
   controls.append(minus,num,plus);box.append(lab,controls);counters.append(box);
  });
  card.append(top,counters);$('list').append(card);
 });
}
$('add').onclick=()=>{$('newname').value='';$('dlg').showModal();setTimeout(()=>$('newname').focus(),100)};
$('addform').addEventListener('submit',e=>{e.preventDefault();const name=$('newname').value.trim();if(!name)return;if(items.some(x=>x.name===name)){alert('同じ名前の商品が登録されています');return}items.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name,stock:0,listed:0});$('dlg').close();persist()});
$('search').addEventListener('input',render);
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();
</script>
</body>
</html>
